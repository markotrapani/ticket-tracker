<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ticket Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="bi bi-ticket-detailed"></i> Ticket Tracker</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/tickets' %}active{% endif %}" href="/tickets">Tickets</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/stats' %}active{% endif %}" href="/stats">Statistics</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/interview-prep' %}active{% endif %}" href="/interview-prep">
                            <i class="bi bi-star-fill text-warning"></i> Interview Prep
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/chat' %}active{% endif %}" href="/chat" id="chatNavLink">
                            <i class="bi bi-chat-dots"></i> Chat
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/import' %}active{% endif %}" href="/import">Import</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/manage' %}active{% endif %}" href="/manage">
                            <i class="bi bi-gear"></i> Manage
                        </a>
                    </li>
                </ul>
                <button class="btn btn-sm btn-outline-success me-3" data-bs-toggle="modal" data-bs-target="#quickAddModal">
                    <i class="bi bi-plus-lg"></i> New Ticket
                </button>
                <form class="d-flex" action="/tickets" method="get">
                    <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Search tickets..." aria-label="Search">
                    <button class="btn btn-outline-light btn-sm" type="submit"><i class="bi bi-search"></i></button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </div>

    <!-- Quick Add Ticket Modal -->
    <div class="modal fade" id="quickAddModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle"></i> Quick Add Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">ZenDesk Ticket ID <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="qa-zendesk-id" required placeholder="e.g. 153756">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Created Date</label>
                            <input type="date" class="form-control" id="qa-created-date">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="qa-status">
                                <option value="Closed" selected>Closed</option>
                                <option value="Solved">Solved</option>
                                <option value="Open">Open</option>
                                <option value="Pending">Pending</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-control" id="qa-subject" placeholder="Brief ticket subject">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Customer</label>
                        <input type="text" class="form-control" id="qa-customer" placeholder="Customer name">
                    </div>
                    <div id="quick-add-result"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="quickAddTicket()">
                        <i class="bi bi-plus-lg"></i> Create Ticket
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // Check Ollama availability and update Chat nav link
    fetch('/api/chat/ollama/health').then(r => r.json()).then(data => {
        const link = document.getElementById('chatNavLink');
        if (!link) return;
        if (!data.available || !data.models || data.models.length === 0) {
            link.classList.add('opacity-50');
            link.title = 'Ollama not running \u2013 Chat works in retrieve-only mode';
            link.innerHTML = '<i class="bi bi-chat-dots"></i> Chat <i class="bi bi-exclamation-circle-fill text-warning" style="font-size:0.65rem"></i>';
        }
    }).catch(() => {
        const link = document.getElementById('chatNavLink');
        if (link) {
            link.classList.add('opacity-50');
            link.title = 'Ollama not running \u2013 Chat works in retrieve-only mode';
            link.innerHTML = '<i class="bi bi-chat-dots"></i> Chat <i class="bi bi-exclamation-circle-fill text-warning" style="font-size:0.65rem"></i>';
        }
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>
    async function quickAddTicket() {
        const zendesk_id = document.getElementById('qa-zendesk-id').value.trim();
        if (!zendesk_id) {
            document.getElementById('quick-add-result').innerHTML =
                '<div class="alert alert-danger py-1">ZenDesk ID is required</div>';
            return;
        }
        const payload = {
            zendesk_id: zendesk_id,
            status: document.getElementById('qa-status').value,
        };
        const created = document.getElementById('qa-created-date').value;
        if (created) payload.created_date = created;
        const subject = document.getElementById('qa-subject').value.trim();
        if (subject) payload.subject = subject;
        const customer = document.getElementById('qa-customer').value.trim();
        if (customer) payload.customer_name = customer;

        const resp = await fetch('/api/tickets', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await resp.json();
        const el = document.getElementById('quick-add-result');
        if (resp.ok) {
            el.innerHTML = `<div class="alert alert-success py-1">
                Ticket #${data.zendesk_id} created!
                <a href="/tickets/${data.zendesk_id}">View ticket</a>
            </div>`;
            document.getElementById('qa-zendesk-id').value = '';
            document.getElementById('qa-subject').value = '';
            document.getElementById('qa-customer').value = '';
        } else {
            el.innerHTML = `<div class="alert alert-danger py-1">${data.error}</div>`;
        }
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
